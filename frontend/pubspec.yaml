name: frontend
description: "TimeCapsule - A digital vault for time and location-locked messages"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.5
  cloud_functions: ^6.0.5
  firebase_messaging: ^16.1.0
  
  # State Management
  provider: ^6.1.2
  
  # Media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.10.1
  
  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  
  # UI/Utils
  intl: ^0.20.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
